<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>رادار مهر رضوی | نرخ‌های بورس کالا</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1A1F1B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

  <style>
    :root {
      --bg-dark: #1A1F1B;
      --surface-dark: #222923;
      --card-bg: #222923;
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #388E3C;
      --primary-light: #4CAF50;
      --text-main: #FFFFFF;
      --text-muted: #9E9E9E;
      --green-trend: #4CAF50;
      --red-trend: #E53935;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    
    /* پشتیبانی از دارک/لایت مود */
    @media (prefers-color-scheme: light) {
        :root {
            --bg-dark: #f3f4f6;
            --surface-dark: #ffffff;
            --card-bg: #ffffff;
            --card-border: rgba(0, 0, 0, 0.1);
            --primary: #388E3C;
            --primary-light: #4CAF50;
            --text-main: #111827;
            --text-muted: #6b7280;
        }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent;}
    body { font-family: 'Vazirmatn', sans-serif; background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    #app-container { flex: 1; max-width: 600px; margin: 0 auto; width: 100%; padding: calc(var(--safe-top) + 12px) 16px calc(var(--safe-bottom) + 24px) 16px; }

    .app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .brand-title-row { display: flex; align-items: center; gap: 10px; }
    .brand-title { font-size: 16px; font-weight: 800; color: var(--text-main); }
    .brand-subtitle { font-size: 11px; color: var(--text-muted); }
    .icon-btn { background: rgba(128, 128, 128, 0.1); border: 1px solid var(--card-border); color: var(--text-main); width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    .categories-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; scrollbar-width: none; }
    .categories-bar::-webkit-scrollbar { display: none; }
    .cat-chip { display: flex; align-items: center; gap: 6px; padding: 7px 14px; background-color: var(--surface-dark); border: 1px solid var(--card-border); border-radius: 20px; font-size: 12px; font-weight: 600; color: var(--text-muted); white-space: nowrap; cursor: pointer; }
    .cat-chip.active { background-color: var(--primary); border-color: var(--primary-light); color: #FFF; }

    .status-badge { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-bottom: 12px; }
    .pulse-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background-color: var(--green-trend); margin-left: 6px; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

    .cards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (max-width: 360px) { .cards-grid { grid-template-columns: 1fr; } }

    .price-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; cursor: pointer; }
    .card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .card-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .card-icon svg { width: 22px; height: 22px; }
    .supplier-name { font-size: 12px; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product-name { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
    .card-trend { font-size: 11px; font-weight: 700; margin-bottom: 12px; }
    .trend-up { color: var(--green-trend); }
    .trend-down { color: var(--red-trend); }
    .trend-zero { color: var(--text-muted); }
    .card-price-row { margin-top: auto; display: flex; align-items: baseline; justify-content: space-between; }
    .price-val { font-size: 17px; font-weight: 900; color: var(--text-main); }
    .price-currency { font-size: 9px; color: var(--text-muted); margin-right: 3px; }
    .price-tag { font-size: 9px; background: rgba(128, 128, 128, 0.15); padding: 2px 6px; border-radius: 6px; color: var(--text-muted); }
    .card-bottom-info { display: flex; justify-content: space-between; margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(128, 128, 128, 0.2); font-size: 9px; color: var(--text-muted); }
    .price-val.traded-green { color: var(--green-trend) !important; }

    /* Modal */
    #detail-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); z-index: 10000; display: none; align-items: flex-end; justify-content: center; padding-top: calc(var(--safe-top) + 16px); }
    .modal-content { background: var(--surface-dark); border-radius: 28px 28px 0 0; width: 100%; max-width: 600px; max-height: calc(90dvh); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--card-border); border-bottom: none; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-fixed-top { padding: 12px 20px 12px; border-bottom: 1px solid var(--card-border); background: var(--surface-dark); }
    .sheet-handle { width: 36px; height: 4px; background: rgba(128, 128, 128, 0.4); border-radius: 2px; margin: 0 auto 12px; }
    .modal-header-row { display: flex; align-items: center; gap: 12px; }
    .modal-close-icon { background: rgba(128, 128, 128, 0.1); border: 1px solid var(--card-border); color: var(--text-main); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .modal-scroll-area { flex: 1; overflow-y: auto; padding: 16px 20px calc(var(--safe-bottom) + 24px); }
    .detail-row { display: flex; justify-content: space-between; font-size: 13px; padding-bottom: 8px; border-bottom: 1px solid var(--card-border); margin-bottom: 12px;}
    .detail-label { color: var(--text-muted); }
    .detail-val { color: var(--text-main); font-weight: 700; }

    .chart-box { background: rgba(128, 128, 128, 0.05); border: 1px solid var(--card-border); border-radius: 14px; padding: 12px; margin-bottom: 14px; }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .chart-title { font-size: 12px; font-weight: 700; color: var(--text-main); }
    .period-toggles { display: flex; gap: 4px; direction: ltr; }
    .period-btn { background: rgba(128, 128, 128, 0.1); border: none; color: var(--text-muted); border-radius: 6px; padding: 4px 10px; font-size: 10px; cursor: pointer; font-family: inherit; font-weight: 600;}
    .period-btn.active { background: var(--text-main); color: var(--bg-dark); }
    #apex-chart-area { direction: ltr; margin: 0 -10px; }
  </style>
</head>
<body>

  <div id="app-container">
    <header class="app-header">
      <div class="brand-title-row">
        <div style="width: 38px; height: 38px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 18px;">📊</div>
        <div>
          <h1 class="brand-title">رادار بورس کالا</h1>
          <p class="brand-subtitle">هلدینگ آرمان مهررضوی</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="fetchData()">🔄</button>
      </div>
    </header>

    <div class="categories-bar" id="categories-container"></div>

    <div class="status-badge">
      <div><span class="pulse-dot"></span> تابلوی زنده معاملات IME</div>
      <div id="update-time-text">بارگذاری کامل اطلاعات...</div>
    </div>

    <main class="cards-grid" id="cards-container">
      <p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">در حال دریافت داده‌ها...</p>
    </main>
  </div>

  <div id="detail-modal" onclick="closeDetailModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-fixed-top">
        <div class="sheet-handle"></div>
        <div class="modal-header-row">
          <div id="modal-icon" class="card-icon" style="width: 44px; height: 44px; flex-shrink: 0; background: var(--primary);"></div>
          <div style="flex: 1; min-width: 0;">
            <h2 id="modal-supplier" style="font-size: 16px; font-weight: 800; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">-</h2>
            <p id="modal-product" style="font-size: 12px; color: var(--text-muted);">-</p>
          </div>
          <button class="modal-close-icon" onclick="closeDetailModal()">✕</button>
        </div>
      </div>

      <div class="modal-scroll-area">
        <div class="chart-box">
          <div class="chart-header">
            <div class="chart-title">نمودار قیمت (پایه و پایانی)</div>
            <div class="period-toggles" id="chart-toggles">
                <button class="period-btn" data-range="30">1M</button>
                <button class="period-btn" data-range="90">3M</button>
                <button class="period-btn" data-range="180">6M</button>
                <button class="period-btn active" data-range="all">1Y</button>
            </div>
          </div>
          <div id="apex-chart-area"></div>
        </div>

        <div id="modal-details"></div>
      </div>
    </div>
  </div>

  <script>
    const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
    const toPersianDigits = (str) => str ? str.toString().replace(/[0-9]/g, d => persianDigits[d]) : '—';
    const formatAmount = (val) => { 
        if (!val) return '—';
        const num = parseInt(String(val).replace(/,/g, ''), 10);
        return isNaN(num) ? toPersianDigits(val) : toPersianDigits(num.toLocaleString('en-US')); 
    };
    const isDarkMode = () => window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

    function getCommodityIconSvg(product) {
        return `<svg viewBox="0 0 24 24" width="22" height="22" fill="none"><path d="M12 3L21 12L12 21L3 12Z" fill="#FFF"/><circle cx="12" cy="12" r="3" fill="#1A1F1B" fill-opacity="0.3"/></svg>`;
    }
    function getCommodityGradient(product) {
      if (product.includes("گندله")) return 'linear-gradient(135deg, #E5A855 0%, #B87825 100%)';
      if (product.includes("کنسانتره")) return 'linear-gradient(135deg, #5CB8E4 0%, #267CA8 100%)';
      if (product.includes("شمش")) return 'linear-gradient(135deg, #E07850 0%, #A84218 100%)';
      if (product.includes("میلگرد")) return 'linear-gradient(135deg, #5DBB7D 0%, #2F7D4B 100%)';
      return 'linear-gradient(135deg, #8B9CB5 0%, #4A5C75 100%)';
    }

    let rawHistory = [];
    let latestUpdates = [];
    let mergedChartData = {}; 
    let displayCards = []; 
    let currentChartData = [];
    let currentApexChart = null;
    let selectedCategory = "همه";
    const categories = ["همه", "گندله", "کنسانتره", "آهن اسفنجی", "شمش", "تختال", "میلگرد"];

    async function fetchData() {
        try {
            // خواندن تاریخچه یکساله برای رسم چارت
            const resHist = await fetch("historical_prices.json?t=" + Date.now());
            rawHistory = await resHist.json();

            // خواندن آپدیت زنده ربات برای نمایش روی کارت‌ها
            const resLive = await fetch("latest_prices.json?t=" + Date.now());
            const dataLive = await resLive.json();
            // اگر ربات ساختار {items: [...]} برمیگرداند
            latestUpdates = dataLive.items ? dataLive.items : dataLive;
            
            document.getElementById('update-time-text').innerText = 'بروزرسانی: ' + (dataLive.updated_at || 'هم‌اکنون');
            
            processAllData();
            renderCategories();
            renderCards();
        } catch (err) {
            console.error(err);
            document.getElementById('cards-container').innerHTML = `<p style="grid-column: 1/-1;text-align:center;color:red;">خطا در دریافت اطلاعات</p>`;
        }
    }

    function processAllData() {
        mergedChartData = {};
        
        // 1. ساخت تاریخچه زمانی چارت از فایل هیستوری
        rawHistory.forEach(item => {
            if(item.final_price === null) return; // روزهایی که معامله نشده رسم نمیشوند
            if(!item.matched_targets) return;
            
            const targetName = item.matched_targets[0];
            if(!mergedChartData[targetName]) mergedChartData[targetName] = {};
            
            mergedChartData[targetName][item.date] = parseInt(item.final_price);
        });

        // 2. تزریق دیتای روز جاری (ربات) به چارت برای زنده بودن نمودار
        latestUpdates.forEach(item => {
            if(item.final_price === null || item.final_price === "0" || !item.matched_targets) return;
            const targetName = item.matched_targets[0];
            if(!mergedChartData[targetName]) mergedChartData[targetName] = {};
            
            mergedChartData[targetName][item.date] = parseInt(item.final_price);
        });

        // تبدیل دیکشنری چارت به آرایه مرتب
        Object.keys(mergedChartData).forEach(key => {
            const dates = Object.keys(mergedChartData[key]).sort();
            mergedChartData[key] = dates.map(d => ({ x: d, y: mergedChartData[key][d] }));
        });

        // 3. آماده سازی کارت ها از روی فایل آپدیت ربات (latest_prices)
        let cardsMap = new Map();
        
        latestUpdates.forEach(item => {
            if(!item.matched_targets) return;
            const targetName = item.matched_targets[0];
            
            // جدا کردن عرضه‌های نقدی از اعتباری برای نمایش کارت مجزا
            const isCredit = item.settlement && (item.settlement.includes("اعتباری") || item.settlement.includes("سلف"));
            const cardKey = targetName + (isCredit ? "_credit" : "_cash");
            
            item.targetName = targetName;
            item.is_credit = isCredit;
            
            // قانون مهم: آیا تقاضا وجود دارد؟
            const demandStr = String(item.demand || "0").replace(/,/g, '');
            const demandNum = parseInt(demandStr);
            const hasDemand = !isNaN(demandNum) && demandNum > 0;
            
            // آیا معامله رقابتی بوده و رنگ باید سبز شود؟
            item.has_real_trade = (item.final_price !== null && item.final_price !== "0" && hasDemand);
            
            // اگر در یک روز یک شرکت چند عرضه از یک نوع (مثلا چند تا نقدی) داشت، تجمیع شوند (در اینجا آخرین مورد جایگزین میشود)
            cardsMap.set(cardKey, item);
        });

        displayCards = Array.from(cardsMap.values());
    }

    function renderCategories() {
        document.getElementById('categories-container').innerHTML = categories.map(cat => 
            `<div class="cat-chip ${cat === selectedCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</div>`
        ).join('');
    }

    function setCategory(cat) { selectedCategory = cat; renderCategories(); renderCards(); }

    function renderCards() {
        const container = document.getElementById('cards-container');
        const filtered = displayCards.filter(item => selectedCategory === "همه" || item.product.includes(selectedCategory));

        if (filtered.length === 0) { container.innerHTML = `<p style="grid-column: 1/-1;text-align:center;">موردی یافت نشد.</p>`; return; }

        container.innerHTML = filtered.map((item, index) => {
            const isTraded = item.has_real_trade;
            const priceNum = isTraded ? item.final_price : item.base_price;
            const priceType = isTraded ? "پایانی" : "پایه";
            
            // رنگ قیمت: اگر تقاضا داشته و فروخته شده سبز شود، وگرنه سفید می‌ماند
            const priceValClass = isTraded ? "price-val traded-green" : "price-val";

            // محاسبه رقابت
            const baseP = parseInt(String(item.base_price).replace(/,/g, ''));
            const finalP = parseInt(String(item.final_price).replace(/,/g, ''));
            
            let trendHtml = '';
            if (isTraded && baseP > 0) {
                const diff = finalP - baseP;
                const diffPct = (diff / baseP) * 100;
                if (diff > 0) trendHtml = `<span class="trend-up">↑ رقابت ٪${toPersianDigits(diffPct.toFixed(2))}</span>`;
                else trendHtml = `<span class="trend-zero">— معامله با نرخ پایه</span>`;
            } else {
                trendHtml = `<span class="trend-zero">بدون معامله</span>`;
            }

            const shortSupplier = (item.producer || item.supplier).replace("معدنی و صنعتی", "").replace("شرکت", "").replace("سنگ آهن", "").trim();
            const grad = getCommodityGradient(item.product);

            return `
              <div class="price-card" onclick="openModal(${index})">
                <div class="card-top">
                  <div class="card-icon" style="background: ${grad}">${getCommodityIconSvg(item.product)}</div>
                  <div class="card-info">
                    <div class="supplier-name">${shortSupplier}</div>
                    <div class="product-name">${item.product}</div>
                  </div>
                </div>
                <div class="card-trend">${trendHtml}</div>
                <div class="card-price-row">
                  <span class="price-tag">${priceType}</span>
                  <div><span class="${priceValClass}">${formatAmount(priceNum)}</span><span class="price-currency">ریال</span></div>
                </div>
                <div class="card-bottom-info">
                  <span>حجم عرضه: ${formatAmount(item.volume)} تن</span>
                  <span>${item.is_credit ? "اعتباری / سلف" : "نقدی"}</span>
                </div>
              </div>
            `;
        }).join('');
    }

    function openModal(index) {
        const item = displayCards[index];
        if (!item) return;

        document.getElementById('modal-supplier').innerText = item.producer || item.supplier;
        document.getElementById('modal-product').innerText = item.product + (item.symbol ? ` (${item.symbol})` : '');
        document.getElementById('modal-icon').style.background = getCommodityGradient(item.product);

        const isTraded = item.has_real_trade;
        const diffVal = isTraded ? `٪${toPersianDigits(((item.final_price - item.base_price) / item.base_price * 100).toFixed(2))}` : '—';

        document.getElementById('modal-details').innerHTML = `
            <div class="detail-row"><span class="detail-label">تاریخ عرضه:</span><span class="detail-val">${item.date}</span></div>
            <div class="detail-row"><span class="detail-label">قیمت پایه:</span><span class="detail-val">${formatAmount(item.base_price)} ریال</span></div>
            ${isTraded ? `<div class="detail-row"><span class="detail-label">قیمت پایانی:</span><span class="detail-val" style="color: var(--green-trend);">${formatAmount(item.final_price)} ریال</span></div>` : ''}
            <div class="detail-row"><span class="detail-label">درصد رقابت:</span><span class="detail-val">${diffVal}</span></div>
            <div class="detail-row"><span class="detail-label">حجم عرضه:</span><span class="detail-val">${formatAmount(item.volume)} تن</span></div>
            <div class="detail-row"><span class="detail-label">حجم تقاضا:</span><span class="detail-val">${formatAmount(item.demand)} تن</span></div>
            <div class="detail-row"><span class="detail-label">نوع تسویه:</span><span class="detail-val">${item.is_credit ? 'اعتباری / سلف' : 'نقدی'}</span></div>
        `;

        currentChartData = mergedChartData[item.targetName] || [];
        document.getElementById('detail-modal').style.display = 'flex';
        
        document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('.period-btn[data-range="all"]').classList.add('active');

        renderApexChart(currentChartData);
    }

    function renderApexChart(dataSlice) {
        if(!dataSlice || dataSlice.length < 2) {
            document.getElementById('apex-chart-area').innerHTML = "<p style='text-align:center; font-size:11px; color:#999; padding:20px 0;'>دیتای کافی برای رسم نمودار ۱ سال گذشته وجود ندارد.</p>";
            return;
        }
        
        const firstPrice = dataSlice[0].y;
        const lastPrice = dataSlice[dataSlice.length - 1].y;
        const colorCode = lastPrice > firstPrice ? '#4CAF50' : (lastPrice === firstPrice ? '#9E9E9E' : '#E53935');

        const options = {
            series: [{ name: 'قیمت', data: dataSlice }],
            theme: { mode: isDarkMode() ? 'dark' : 'light' },
            chart: { type: 'area', height: 180, fontFamily: 'Vazirmatn, sans-serif', toolbar: { show: false }, zoom: { enabled: false }, background: 'transparent' },
            colors: [colorCode],
            fill: { type: 'gradient', gradient: { shadeIntensity: 1, opacityFrom: 0.5, opacityTo: 0.0, stops: [0, 100] } },
            dataLabels: { enabled: false },
            stroke: { curve: 'smooth', width: 2.5 },
            xaxis: { type: 'category', labels: { show: false }, axisBorder: { show: false }, axisTicks: { show: false }, tooltip: { enabled: false }, crosshairs: { stroke: { color: colorCode, width: 1, dashArray: 4 } } },
            yaxis: { show: false, min: Math.min(...dataSlice.map(d => d.y)) * 0.98 },
            grid: { show: false },
            tooltip: { theme: isDarkMode() ? 'dark' : 'light', y: { formatter: (val) => formatAmount(val) + " ریال" }, x: { show: true } }
        };

        if (currentApexChart) currentApexChart.destroy();
        currentApexChart = new ApexCharts(document.querySelector("#apex-chart-area"), options);
        currentApexChart.render();
    }

    document.getElementById('chart-toggles').addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON') {
            document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            const range = e.target.getAttribute('data-range');
            let slice = currentChartData;
            if (range !== 'all') {
                const days = parseInt(range);
                slice = currentChartData.slice(-Math.min(days, currentChartData.length));
            }
            renderApexChart(slice);
        }
    });

    function closeDetailModal() { document.getElementById('detail-modal').style.display = 'none'; }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        if(currentApexChart) currentApexChart.updateOptions({ theme: { mode: e.matches ? 'dark' : 'light' } });
    });

    fetchData();
  </script>
</body>
</html>

name: IME Bot Cloud Watchdog (24/7)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-bot-heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Personal Server Heartbeat & Alert via Bale/SMS
        env:
          EVENT_NAME: ${{ github.event_name }}
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          ADMIN_USERS: ${{ secrets.ADMIN_USERS }}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          SMS_LINE_NUMBER: ${{ secrets.SMS_LINE_NUMBER }}
          MOBILE_NUMBERS: ${{ secrets.MOBILE_NUMBERS }}
          MAX_OFFLINE_MINUTES: "45"
        run: |
          python3 - << 'EOF'
          import os, json, time, subprocess, urllib.request

          event_name = os.getenv("EVENT_NAME", "schedule").strip()
          max_minutes = int(os.getenv("MAX_OFFLINE_MINUTES", "45"))
          now_ts = int(time.time())
          last_seen_ts = 0
          last_seen_str = "نامشخص"
          bot_status = "unknown"

          if os.path.exists("bot_heartbeat.json"):
              try:
                  with open("bot_heartbeat.json", "r", encoding="utf-8") as f:
                      hb = json.load(f)
                      last_seen_ts = int(hb.get("timestamp_utc", 0))
                      last_seen_str = hb.get("last_seen_local") or hb.get("last_seen_utc") or "نامشخص"
                      bot_status = hb.get("status", "unknown")
              except Exception as e:
                  print("Error reading bot_heartbeat.json:", e)

          if last_seen_ts <= 0:
              try:
                  out = subprocess.check_output(
                      ["git", "log", "-1", "--format=%ct|%ci", "--", "latest_prices.json"],
                      text=True
                  ).strip()
                  if "|" in out:
                      ts_s, date_s = out.split("|", 1)
                      last_seen_ts = int(ts_s)
                      last_seen_str = date_s
              except Exception as e:
                  print("Git log fallback error:", e)

          diff_minutes = int((now_ts - last_seen_ts) / 60) if last_seen_ts > 0 else 99999
          print(f"Last bot activity: {diff_minutes} minutes ago ({last_seen_str}) | status={bot_status} | trigger={event_name}")

          def clean_secret(raw_val, expected_key=""):
              if not raw_val:
                  return ""
              lines = [l.strip() for l in raw_val.splitlines() if l.strip() and not l.strip().startswith("#")]
              if not lines:
                  return ""
              chosen = lines[0]
              if expected_key:
                  for l in lines:
                      if l.upper().startswith(expected_key.upper() + "="):
                          chosen = l.split("=", 1)[1].strip()
                          break
              if "=" in chosen and ":" not in chosen.split("=", 1)[0]:
                  chosen = chosen.split("=", 1)[1].strip()
              chosen = chosen.strip("\"' \t\r\n")
              return "".join(chosen.split())

          bale_token = clean_secret(os.getenv("BALE_TOKEN", ""), "BALE_TOKEN")
          if bale_token.lower().startswith("bot"):
              bale_token = bale_token[3:]

          admin_env = clean_secret(os.getenv("ADMIN_USERS", ""), "ADMIN_USERS") or "5526517891"
          admin_users = [u.strip() for u in admin_env.split(",") if u.strip().isdigit()] or ["5526517891"]

          sms_key = clean_secret(os.getenv("SMS_API_KEY", ""), "SMS_API_KEY")
          sms_line = clean_secret(os.getenv("SMS_LINE_NUMBER", ""), "SMS_LINE_NUMBER") or "30002108004628"
          mobiles_env = clean_secret(os.getenv("MOBILE_NUMBERS", ""), "MOBILE_NUMBERS") or "09120464215,09123463075"
          mobiles = [m.strip() for m in mobiles_env.split(",") if m.strip()]

          def send_bale_message(chat_id, text_msg):
              if not bale_token:
                  print("⚠️ BALE_TOKEN secret is empty.")
                  return False
              url = f"https://tapi.bale.ai/bot{bale_token}/sendMessage"
              payload = json.dumps({"chat_id": chat_id, "text": text_msg, "parse_mode": "Markdown"}).encode("utf-8")
              headers = {
                  "Content-Type": "application/json",
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/125.0.0.0",
                  "Connection": "close"
              }
              # تلاش تا ۴ بار برای عبور از کندی لحظه‌ای اینترنت بین‌الملل به ایران
              for attempt in range(1, 5):
                  try:
                      req = urllib.request.Request(url, data=payload, headers=headers, method="POST")
                      urllib.request.urlopen(req, timeout=20)
                      print(f"✅ Bale message sent to {chat_id} (attempt {attempt})")
                      return True
                  except Exception as e:
                      print(f"⚠️ Bale attempt {attempt}/4 to {chat_id} failed: {e}")
                      time.sleep(3)
              return False

          def send_sms_alert(text_msg):
              if not (sms_key and sms_line and mobiles):
                  return False
              url = "https://api.sms.ir/v1/send/bulk"
              payload = json.dumps({
                  "lineNumber": int("".join(filter(str.isdigit, sms_line))),
                  "messageText": text_msg,
                  "mobiles": mobiles,
                  "sendDateTime": None
              }).encode("utf-8")
              headers = {
                  "X-API-KEY": sms_key,
                  "Content-Type": "application/json",
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/125.0.0.0",
                  "Connection": "close"
              }
              for attempt in range(1, 5):
                  try:
                      req_sms = urllib.request.Request(url, data=payload, headers=headers, method="POST")
                      urllib.request.urlopen(req_sms, timeout=20)
                      print(f"✅ SMS alert sent successfully (attempt {attempt})")
                      return True
                  except Exception as e:
                      print(f"⚠️ SMS attempt {attempt}/4 failed: {e}")
                      time.sleep(3)
              return False

          # اگر کاربر دکمه Run workflow را دستی زده باشد، پیام تست سلامت به بله بفرست
          if event_name == "workflow_dispatch" and diff_minutes < max_minutes and bot_status != "stopped":
              test_msg = (
                  f"✅ *تست ناظر ابری گیت‌هاب موفقیت‌آمیز بود!*\n\n"
                  f"🟢 *وضعیت ربات سرور شخصی:* `آنلاین و فعال ({bot_status})`\n"
                  f"⏱️ *آخرین فعالیت ثبت‌شده:* `{diff_minutes} دقیقه پیش`\n"
                  f"🕒 *زمان آخرین آپدیت:* `{last_seen_str}`\n"
                  f"🛡️ ناظر گیت‌هاب هر ۳۰ دقیقه وضعیت سرور شما را به صورت خودکار چک می‌کند."
              )
              for chat_id in admin_users:
                  send_bale_message(chat_id, test_msg)
              exit(0)

          should_alert = False
          if bot_status == "stopped" and diff_minutes <= 60:
              should_alert = True
          elif diff_minutes >= max_minutes:
              if diff_minutes < (max_minutes + 35) or (diff_minutes % 180) < 30 or event_name == "workflow_dispatch":
                  should_alert = True

          if not should_alert:
              print("✅ Bot is online and healthy.")
              exit(0)

          msg = (
              f"🚨 *هشدار ناظر ابری گیت‌هاب (Cloud Watchdog)*\n\n"
              f"⚠️ *ربات سرور شخصی شما متوقف یا قطع شده است!*\n"
              f"⏱️ *مدت زمان عدم پاسخ:* `{diff_minutes} دقیقه`\n"
              f"🕒 *آخرین پالس دریافتی:* `{last_seen_str}`\n"
              f"🔌 *علت احتمالی:* قطعی برق یا اینترنت سرور، بسته شدن پنجره CMD یا خاموش شدن ویندوز."
          )

          for chat_id in admin_users:
              send_bale_message(chat_id, msg)

          send_sms_alert(f"هشدار ناظر گیت‌هاب:\nربات بورس کالا {diff_minutes} دقیقه است که قطع شده است.\nآخرین پالس: {last_seen_str}")
          EOF
